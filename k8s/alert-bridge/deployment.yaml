apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-bridge
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-bridge
  template:
    metadata:
      labels:
        app: alert-bridge
    spec:
      containers:
        - name: alert-bridge
          image: simgpt/alert-bridge:latest
          ports:
            - containerPort: 8080
          env:
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: host
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: port
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: user
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: password
            - name: ALERT_MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: mail-from
            - name: ALERT_MAIL_TO
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: mail-to
